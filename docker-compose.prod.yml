name: bms-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bms_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-bms}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.prod
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-bms_user}:${POSTGRES_PASSWORD:-bms_dev_password}@postgres:5432/${POSTGRES_DB:-bms}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-change-before-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-refresh-secret-change-before-production}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
